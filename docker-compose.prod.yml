# Production companion for the systemd-deployed SaaS (see scripts/deploy.sh).
#
# This file adds ONLY the internal Evolution API (WhatsApp) service. The Next.js
# app keeps running under systemd, and postgres/redis keep running wherever the
# VPS already provides them (DATABASE_URL / REDIS_URL in /opt/final-edu/.env).
#
# Security posture:
# - Evolution's port is published to 127.0.0.1 ONLY. It is reachable from the
#   VPS itself (where the SaaS backend calls it) but never from the internet.
# - There is no second public domain and no second VPS. `docker compose` is run
#   by the same deploy script that ships the SaaS, so one push deploys both.
# - The container talks back to the VPS host via host.docker.internal
#   (postgres/redis AND the Next.js webhook). Addresses like 127.0.0.1 inside
#   the container mean the container itself — never use them for host services.
# - Evolution gets its own `evolution` database. Create it once on the host:
#     psql "$DATABASE_URL" -c "CREATE DATABASE evolution;"
# - Make sure postgres accepts connections from the docker bridge network
#   (listen_addresses + pg_hba), or point EVOLUTION_DB_URI at a reachable
#   address.

services:
  evolution:
    image: atendai/evolution-api:latest # pin to a tested v2 release, e.g. v2.2.x
    extra_hosts:
      # Resolves to the VPS host from inside the container (Linux-safe).
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY must be set in /opt/final-edu/.env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DB_URI:-postgresql://postgres:postgres@host.docker.internal:5432/evolution}
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: ${EVOLUTION_REDIS_URI:-redis://host.docker.internal:6379}
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LANGUAGE: en
      CONFIG_SESSION_PHONE_CLIENT: MtandaoLabs
      DEL_INSTANCE: "false"
      TELEMETRY: "false"
    ports:
      # Loopback-only. Host port 8081: 8080 is already taken on this VPS by an
      # unrelated project's Evolution (wa-api); ours stays fully separate.
      # SaaS talks to it at EVOLUTION_API_URL=http://127.0.0.1:8081.
      - "127.0.0.1:${EVOLUTION_HOST_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      # Node image has no wget/curl — probe with node itself, including the
      # API key so a healthy status proves auth works, not just the port.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/instance/fetchInstances',{headers:{apikey:process.env.AUTHENTICATION_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
