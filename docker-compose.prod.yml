# Production companion for the systemd-deployed SaaS (see scripts/deploy.sh).
#
# This file adds ONLY the internal Evolution API (WhatsApp) service. The Next.js
# app keeps running under systemd, and postgres/redis keep running wherever the
# VPS already provides them (DATABASE_URL / REDIS_URL in /opt/final-edu/.env).
#
# Security posture:
# - Evolution's port is published to 127.0.0.1 ONLY. It is reachable from the
#   VPS itself (where the SaaS backend calls it) but never from the internet.
# - There is no second public domain and no second VPS. `docker compose` is run
#   by the same deploy script that ships the SaaS, so one push deploys both.
# - Evolution reaches the host's postgres/redis via host.docker.internal
#   (override with EVOLUTION_DB_URI / EVOLUTION_REDIS_URI if yours differ).
#   Make sure postgres accepts connections from the docker bridge network
#   (listen_addresses + pg_hba), or point the URIs at a reachable address.
# - Evolution gets its own `evolution` database. Create it once on the host:
#     psql "$DATABASE_URL" -c "CREATE DATABASE evolution;"

services:
  evolution:
    image: atendai/evolution-api:latest # pin to a tested v2 release, e.g. v2.2.x
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY must be set in /opt/final-edu/.env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DB_URI:-postgresql://postgres:postgres@host.docker.internal:5432/evolution}
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: ${EVOLUTION_REDIS_URI:-redis://host.docker.internal:6379}
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LANGUAGE: en
      CONFIG_SESSION_PHONE_CLIENT: MtandaoLabs
      DEL_INSTANCE: "false"
      TELEMETRY: "false"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
