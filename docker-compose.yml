services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mtandaolabsedu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate `evolution` database on first init so Evolution
      # never shares tables with the Prisma-managed SaaS schema.
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ─── Evolution API (WhatsApp) — INTERNAL ONLY ───
  # Single shared Evolution service for the whole deployment. Tenancy is
  # enforced one level up: each school gets its own Evolution *instance*
  # (created by the SaaS backend), never its own server. The port is bound to
  # loopback so it is reachable from this machine but never from the internet.
  # host.docker.internal lets the container call back to a Next.js running on
  # the host (EVOLUTION_WEBHOOK_URL=http://host.docker.internal:3000).
  evolution:
    image: evoapicloud/evolution-api:latest # v2 line; pin to a tested tag for stability
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution-dev-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LANGUAGE: en
      CONFIG_SESSION_PHONE_CLIENT: MtandaoLabs
      DEL_INSTANCE: "false"
      TELEMETRY: "false"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
